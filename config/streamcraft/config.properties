#StreamCraft Server Configuration
# TBS: vanilla-client joins must stay on (the vanilla-client contract). StreamCraft 0.25.1+
# defaults allow_vanilla_clients to false, so the pack sets it explicitly.
# TBS: StreamCraft social (Discover, Friends, Board) is on. Set here, not in-game: pack updates
# replace this file, so an in-game toggle would not survive a deploy.
allow_vanilla_clients=true
allow_web_chat=true
allow_web_sharing=true
api_url=https\://theblock.academy/api/streamcraft
proximity_range=32
social_enabled=true
voice_bind_address=
voice_enabled=true
voice_host=
voice_relay_port=24455
